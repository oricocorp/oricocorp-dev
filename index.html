<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comercializadora ORICO 1706, C.A.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

}

body{

font-family:Arial,Helvetica,sans-serif;

background:
linear-gradient(
135deg,
#EAF7F5 0%,
#CFEFEB 18%,
#3AA89A 45%,
#0C7772 75%,
#F58220 100%
);

min-height:100vh;

overflow-x:hidden;

}



/*==========================
HEADER
==========================*/

header{

position:fixed;

top:0;

left:0;

width:100%;

height:110px;

display:grid;

grid-template-columns:320px 1fr 120px;

align-items:center;

padding:8px 40px 18px 40px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

z-index:9999;

}



/*==========================
LOGO
==========================*/

.logo{

display:flex;

align-items:flex-start;

padding-top:12px;

}

.logo img{

height:158px;

width:auto;

filter:drop-shadow(0 8px 18px rgba(255,255,255,.35));

}



/*==========================
MENU
==========================*/

nav{

display:flex;

justify-content:center;

align-items:center;

flex-wrap:nowrap;

gap:0;

}

nav a{

text-decoration:none;

color:#083C3D;

font-size:17px;

font-weight:600;

padding:0 16px;

border-right:1px solid rgba(8,60,61,.35);

transition:.30s;

}

nav a:last-child{

border-right:none;

}

nav a:hover{

color:#F58220;

}






/*==========================
CONTENIDO
==========================*/

main{

padding-top:140px;

min-height:100vh;

}
/*==========================
PORTADA CON VIDEO
==========================*/

.hero{

position:relative;

display:flex;

justify-content:center;

align-items:center;

width:100%;

padding:40px 0 60px;

overflow:hidden;

}
.hero-box{

position:absolute;

left:90px;

top:46%;

transform:translateY(-50%);

width:420px;

height:380px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(12px);

border-radius:20px;

border:1px solid rgba(255,255,255,.20);

box-shadow:0 15px 40px rgba(0,0,0,.18);

z-index:10;

}
.hero-video{

width:min(72vw,1100px);

aspect-ratio:16/9;

height:auto;

display:block;

object-fit:cover;

border-radius:22px;

box-shadow:0 30px 70px rgba(0,0,0,.35);
pointer-events: none;
}

/*==========================
FOOTER
==========================*/

footer{

background:#083C3D;

color:white;

text-align:center;

padding:20px;

font-size:14px;

letter-spacing:1px;

}
/*========================================
RESPONSIVE
========================================*/

/* Laptop */
@media (max-width:1366px){

header{

grid-template-columns:260px 1fr;

padding:8px 25px;

}

.logo img{

height:125px;

}

nav a{

font-size:15px;

padding:0 12px;

}

.hero-video{

width:min(82vw,900px);

height:auto;

aspect-ratio:16/9;

}

}

/* Tablet */
@media (max-width:992px){

header{

display:flex;

flex-direction:column;

height:auto;

padding:15px;

}

.logo{

justify-content:center;

}

nav{

margin-top:15px;

flex-wrap:wrap;

}

nav a{

font-size:15px;

padding:8px 10px;

border:none;

}

.hero{

height:auto;

padding:30px 0;

}

.hero-video{

width:min(82vw,900px);

aspect-ratio:16/9;

height:auto;

}
}

/* Celular */
@media (max-width:768px){

.logo img{

height:95px;

}

nav{

flex-wrap:wrap;

justify-content:center;

gap:10px;

}

nav a{

font-size:15px;

padding:6px 8px;

border:none;

}
.hero{

padding-top:140px;

padding-bottom:40px;

}
.hero-video{

width:92vw;

border-radius:15px;

}

}
</style>

</head>
<body>
<header>

<div class="logo">
<img src="logo.png" alt="ORICO">
</div>

<nav>

<a href="#inicio">Inicio</a>

<a href="#quienes">Quiénes Somos</a>

<a href="#sectores">Sectores</a>

<a href="#clientes">Clientes y Aliados</a>

<a href="#contacto">Contacto</a>

</nav>



</header>

<main>

<section id="inicio" class="hero">

<div class="hero-box">

</div>

<video autoplay muted loop playsinline class="hero-video">

<source src="video.mp4.mp4" type="video/mp4">

</video>

</section>

<section id="quienes">

</section>

<section id="sectores">

</section>

<section id="clientes">

</section>

<section id="contacto">

</section>

</main>

<footer>

ORICO CORP - DEVELOPMENT VERSION

</footer>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comercializadora ORICO 1706, C.A.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

}

body{

font-family:Arial,Helvetica,sans-serif;

background:
linear-gradient(
135deg,
#EAF7F5 0%,
#CFEFEB 18%,
#3AA89A 45%,
#0C7772 75%,
#F58220 100%
);

min-height:100vh;

overflow-x:hidden;

}



/*==========================
HEADER
==========================*/

header{

position:fixed;

top:0;

left:0;

width:100%;

height:110px;

display:grid;

grid-template-columns:320px 1fr 120px;

align-items:center;

padding:8px 40px 18px 40px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

z-index:9999;

}



/*==========================
LOGO
==========================*/

.logo{

display:flex;

align-items:flex-start;

padding-top:12px;

}

.logo img{

height:150px;

width:auto;

filter:drop-shadow(0 8px 18px rgba(255,255,255,.35));

}



/*==========================
MENU
==========================*/

nav{

display:flex;

justify-content:center;

align-items:center;

flex-wrap:nowrap;

gap:0;

}

nav a{

text-decoration:none;

color:#083C3D;

font-size:17px;

font-weight:600;

padding:0 16px;

border-right:1px solid rgba(8,60,61,.35);

transition:.30s;

}

nav a:last-child{

border-right:none;

}

nav a:hover{

color:#F58220;

}






/*==========================
CONTENIDO
==========================*/

main{

padding-top:140px;

min-height:100vh;

}
/*==========================
PORTADA CON VIDEO
==========================*/

.hero{

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.hero-video{

width:75%;

height:650px;

object-fit:cover;

border-radius:18px;

box-shadow:0 25px 60px rgba(0,0,0,.35);

}
.hero-overlay{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(8,60,61,.35);

z-index:2;

}
/*==========================
FOOTER
==========================*/

footer{

background:#083C3D;

color:white;

text-align:center;

padding:20px;

font-size:14px;

letter-spacing:1px;

}

</style>

</head>
<body>
<header>

<div class="logo">
    <img src="logo.png" alt="ORICO">
</div>

<nav>

<a href="#inicio">Inicio</a>

<a href="#quienes">Quiénes Somos</a>

<a href="#sectores">Sectores</a>

<a href="#clientes">Clientes y Aliados</a>

<a href="#contacto">Contacto</a>

</nav>



</header>

<main>

<section id="inicio" class="hero">

<video autoplay muted loop playsinline class="hero-video">

<source src="video.mp4.mp4" type="video/mp4">

</video>

<div class="hero-overlay"></div>

</section>

<section id="quienes">

</section>

<section id="sectores">

</section>

<section id="clientes">

</section>

<section id="contacto">

</section>

</main>

<footer>

ORICO CORP - DEVELOPMENT VERSION

</footer>

</body>

</html>

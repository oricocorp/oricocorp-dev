<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comercializadora ORICO 1706, C.A.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

}

body{

font-family:Arial,Helvetica,sans-serif;

background:
linear-gradient(
135deg,
#EAF7F5 0%,
#CFEFEB 18%,
#3AA89A 45%,
#0C7772 75%,
#F58220 100%
);

min-height:100vh;

overflow-x:hidden;

}



/*==========================
HEADER
==========================*/

header{

position:fixed;

top:0;
left:0;

width:100%;
height:120px;

display:grid;

grid-template-columns:300px 1fr 140px;

align-items:center;

padding:0 30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

z-index:9999;

}



/*==========================
LOGO
==========================*/

.logo{

display:flex;

align-items:flex-start;

padding-top:12px;

}

.logo img{

height:150px;

width:auto;

filter:drop-shadow(0 8px 18px rgba(255,255,255,.35));

}


/*==========================
MENU
==========================*/

nav{

display:flex;

justify-content:center;

align-items:center;

gap:38px;

width:100%;

}
nav a{

text-decoration:none;

color:#083C3D;

font-size:17px;

font-weight:600;

transition:.30s;

}



nav a:hover{

color:#F58220;

}






/*==========================
CONTENIDO
==========================*/

main{

padding-top:190px;
min-height:100vh;

}
/*==========================
PORTADA CON VIDEO
==========================*/

.hero{

width:100%;

padding:0 40px 60px;
display:grid;

grid-template-columns:340px minmax(0,1fr);
gap:40px;

align-items:center;

max-width:1600px;

margin:auto;

}
.hero-media{

width:100%;

height:520px;

overflow:hidden;

border-radius:22px;

box-shadow:0 30px 70px rgba(0,0,0,.25);

}
.hero-video{

width:100%;

height:100%;

display:block;

object-fit:cover;

pointer-events:none;

}
.hero-box{

display:flex;

flex-direction:column;

justify-content:center;

height:100%;

padding:10px 0;

}

.hero-title{

font-size:50px;

font-weight:800;

line-height:1.15;

color:#0B5B63;

margin-bottom:28px;

}

.hero-title span{

color:#F58220;

}

.hero-subtitle{

font-size:24px;

font-weight:500;

line-height:1.5;

color:#2F3D40;

max-width:320px;

margin-bottom:40px;

}
/*==========================
FOOTER
==========================*/

footer{

background:#083C3D;

color:white;

text-align:center;

padding:20px;

font-size:14px;

letter-spacing:1px;

}
/*========================================
RESPONSIVE
========================================*/

/* Laptop */
@media (max-width:1366px){

header{

grid-template-columns:260px 1fr;

padding:8px 25px;

}

.logo img{

height:125px;

}

nav a{

font-size:15px;

padding:0 12px;

}

width:100%;

max-width:100%;

aspect-ratio:16/9;

height:auto;

}

}

/* Tablet */
@media (max-width:992px){

header{

display:flex;

flex-direction:column;

height:auto;

padding:15px;

}

.logo{

justify-content:center;

}

nav{

margin-top:15px;

flex-wrap:wrap;

}

nav a{

font-size:15px;

padding:8px 10px;

border:none;

}

.hero{

height:auto;

padding:30px 0;

}

.hero-video{

width:min(82vw,900px);

aspect-ratio:16/9;

height:auto;

}
}

/* Celular */
@media (max-width:768px){

.logo img{

height:95px;

}

nav{

flex-wrap:wrap;

justify-content:center;

gap:10px;

}

nav a{

font-size:15px;

padding:6px 8px;

border:none;

}
.hero{

padding-top:140px;

padding-bottom:40px;

}
.hero-video{

width:92vw;

border-radius:15px;

}

}
</style>

</head>
<body>
<header>

<div class="logo">
<img src="logo.png" alt="ORICO">
</div>

<nav>

<a href="#inicio">Inicio</a>

<a href="#quienes">Quiénes Somos</a>

<a href="#sectores">Sectores</a>

<a href="#clientes">Clientes y Aliados</a>

<a href="#contacto">Contacto</a>

</nav>



</header>

<main>

<section id="inicio" class="hero">
<div class="hero-box">

    

    <h2 class="hero-title">
    Abastecemos la <span>industria.</span><br>
    Conectamos <span>mercados.</span>
</h2>

<h3>

    Soluciones integrales de comercialización,
    logística y abastecimiento.

</h3>

    

    

</div>

<div class="hero-media">

    <video autoplay muted loop playsinline class="hero-video">

        <source src="video.mp4.mp4" type="video/mp4">

    </video>

</div>

</section>

<section id="quienes">

</section>

<section id="sectores">

</section>

<section id="clientes">

</section>

<section id="contacto">

</section>

</main>

<footer>

ORICO CORP - DEVELOPMENT VERSION

</footer>

</body>

</html>

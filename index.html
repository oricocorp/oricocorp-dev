<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORICO CORP - Desarrollo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,Helvetica,sans-serif;

background:linear-gradient(
135deg,
#EAF7F5 0%,
#CFEFEB 18%,
#3AA89A 45%,
#0C7772 75%,
#F58220 100%
);

display:flex;
flex-direction:column;

min-height:100vh;

}
header{
position:fixed;
top:0;
left:0;
width:100%;
height:110px;

display:flex;
align-items:center;
justify-content:space-between;

padding:10px 35px;

z-index:1000;
}

.logo{
width:280px;
display:flex;
align-items:center;
}

.logo img{
height:155px;
width:auto;
display:block;
filter:drop-shadow(0 6px 18px rgba(255,255,255,.35));
}

nav{
flex:2;
display:flex;
justify-content:center;
gap:40px;
}

nav a{
text-decoration:none;
color:#083C3D;
font-size:18px;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#F58220;
}

.idioma{
width:180px;
display:flex;
justify-content:flex-end;
align-items:center;
font-size:28px;
gap:12px;
}
main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
}

main img{
width:100%;
max-width:1600px;
height:auto;
box-shadow:0 15px 40px rgba(0,0,0,.15);
border-radius:8px;
}

footer{
background:#083c3d;
color:white;
text-align:center;
padding:18px;
font-size:15px;
}

</style>

</head>

<body>

<header>

<div class="logo">
    <img src="logo.png" alt="ORICO">
</div>

<nav>

<a href="#inicio">Inicio</a>

<a href="#quienes">Quiénes Somos</a>

<a href="#sectores">Sectores</a>

<a href="#clientes">Clientes y Aliados</a>

<a href="#contacto">Contacto</a>

</nav>

<div class="idioma">

🇻🇪 🇬🇧

</div>

</header>

<main>

</main>

<footer>

ORICO CORP - DEVELOPMENT VERSION

</footer>

</body>

</html>
